<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Cliente web desenvolvido com Vite e JavaScript Vanilla consumindo a API JSONPlaceholder."
    />

    <title>Projeto 01 - Usuários e Posts</title>
  </head>

  <body>
    <header class="hero">
      <div class="container">
        <p class="eyebrow">
          Projeto 01 • API + JavaScript Vanilla
        </p>

        <h1>
          Usuários e seus posts
        </h1>

        <p class="subtitle">
          Consulte usuários da JSONPlaceholder e veja
          os posts relacionados a cada um.
        </p>
      </div>
    </header>

    <main class="container">
      <section class="toolbar">
        <div>
          <h2>Usuários</h2>

          <p id="status" class="status">
            Carregando...
          </p>
        </div>

        <label class="search">
          <span>Pesquisar</span>

          <input
            id="searchInput"
            type="search"
            placeholder="Nome ou e-mail"
          />
        </label>
      </section>

      <section id="users" class="users-grid"></section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>
          Dados fornecidos pela API JSONPlaceholder.
        </p>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
